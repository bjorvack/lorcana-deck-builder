pre-commit:
  commands:
    biome:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,cts,mts,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    checks:
      run: npm run typecheck && npm test
