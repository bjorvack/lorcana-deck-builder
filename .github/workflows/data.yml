name: Data refresh

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
      LH_CLIENT_ID: ${{ secrets.LH_CLIENT_ID }}
      LH_CLIENT_SECRET: ${{ secrets.LH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:pipeline
      # rebuilds the arena section of public/data/report.json (the pipeline
      # regenerates the file without it); vendored engine is committed, so no
      # extra install is needed
      - name: Arena card-mapping coverage
        run: npx tsx scripts/training/arena/map.ts
      # dot.gg needs no API key — committed state + event caches make this ~1
      # listing request when nothing is new; --max-decks caps damage if state is
      # ever lost (chunked continuation instead of a full re-backfill)
      - name: Incremental tournament sync (DotGG)
        run: npx tsx scripts/sources/dotgg.ts --cut 0 --max-decks 500
      - name: Incremental tournament sync (TopDeck)
        if: ${{ env.TOPDECK_API_KEY != '' }}
        run: npx tsx scripts/sources/topdeck.ts
      - name: Incremental tournament sync (Lorcanahunter)
        if: ${{ env.LH_CLIENT_ID != '' && env.LH_CLIENT_SECRET != '' }}
        run: npx tsx scripts/sources/lorcanahunter.ts
      - name: Train meta model (gated by holdout backtest)
        run: npx tsx scripts/training/train.ts
      - name: Emit meta artifact
        run: npx tsx scripts/emit-model.ts
      # ---- automated training (uses the fresh meta artifact + interactions) ----
      # CI budget: 4 generations x 24 decks x 12 games/candidate (~1,150 games
      # on 4 vCPU). The gate verdict is recorded in the result JSON either way;
      # a FAIL week is data, not a build failure.
      - name: Deck evolution (arena fitness)
        run: |
          WEEK=$(date -u +%G%V)
          npx tsx scripts/training/arena/evolve.ts \
            --generations 4 --population 24 --games-per-candidate 12 \
            --parallel 4 --seed "$WEEK"
      # traces are deterministic and reproducible from the documented batch
      # command + seeds, so the ~20 MB corpus is generated and consumed
      # in-run but not committed
      - name: Ranker trace generation
        run: |
          npx tsx scripts/training/arena/batch.ts --games 6 --decks 12 \
            --trace --parallel 4 --seed-base 7000 \
            --out scripts/training/output/ranker-traces.json
      - name: Ranker training (outcome-supervised logistic regression)
        run: |
          npx tsx scripts/training/arena/ranker.ts \
            --traces scripts/training/output/ranker-traces.json \
            --iterations 400 --out scripts/training/data/arena/ranker.json
      - name: Ranker head-to-head gate
        continue-on-error: true # the verdict is recorded either way
        run: |
          npx tsx scripts/training/arena/rank-gate.ts \
            --weights scripts/training/data/arena/ranker.json \
            --games 96 --parallel 4
      - name: Commit snapshot + meta data + training outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data scripts/training/data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            BRANCH="data/refresh-${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git commit -m "chore(data): weekly snapshot + meta sync + training" -m "AI: agentic"
            git push -u origin "$BRANCH"
            PR_URL=$(gh pr create --base main --head "$BRANCH" \
              --title "chore(data): weekly snapshot + meta sync + training" \
              --body "Automated weekly data refresh.")
            gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge not enabled or checks pending; PR opened at $PR_URL"
          fi
