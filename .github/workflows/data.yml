name: Data refresh

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
      LH_CLIENT_ID: ${{ secrets.LH_CLIENT_ID }}
      LH_CLIENT_SECRET: ${{ secrets.LH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:pipeline
      # rebuilds the arena section of public/data/report.json (the pipeline
      # regenerates the file without it); vendored engine is committed, so no
      # extra install is needed
      - name: Arena card-mapping coverage
        run: npx tsx scripts/training/arena/map.ts
      # dot.gg needs no API key — committed state + event caches make this ~1
      # listing request when nothing is new; --max-decks caps damage if state is
      # ever lost (chunked continuation instead of a full re-backfill)
      - name: Incremental tournament sync (DotGG)
        run: npx tsx scripts/sources/dotgg.ts --cut 0 --max-decks 500
      - name: Incremental tournament sync (TopDeck)
        if: ${{ env.TOPDECK_API_KEY != '' }}
        run: npx tsx scripts/sources/topdeck.ts
      - name: Incremental tournament sync (Lorcanahunter)
        if: ${{ env.LH_CLIENT_ID != '' && env.LH_CLIENT_SECRET != '' }}
        run: npx tsx scripts/sources/lorcanahunter.ts
      - name: Train meta model (gated by holdout backtest)
        run: npx tsx scripts/training/train.ts
      - name: Emit meta artifact
        run: npx tsx scripts/emit-model.ts
      - name: Commit snapshot + meta data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data scripts/training/data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "chore(data): weekly snapshot + meta sync" -m "AI: agentic"
            git push
          fi
